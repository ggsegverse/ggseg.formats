url: https://ggsegverse.github.io/ggseg.formats/

template:
  package: ggseg.docs

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github, lightswitch]
  components:
    github:
      icon: fa-github
      href: https://github.com/ggsegverse/ggseg.formats
      aria-label: GitHub

reference:
  - title: ggseg atlas
    desc: Create and inspect ggseg atlas objects.
    contents:
      - core_contract
      - starts_with("ggseg_")
      - starts_with("is_ggseg")
      - starts_with("as_ggseg")
      - starts_with("assert_")
  - title: Legacy conversion
    desc: Convert old ggseg/ggseg3d atlases to the unified ggseg_atlas format.
    contents:
      - convert_legacy_brain_atlas
      - contains("brain_")
      - migrate_atlas_display
      - migrate_atlas_hemi
  - title: Accessors
    desc: Query atlas contents without reaching into slots directly.
    contents:
      # tracks @family atlas accessors. Deliberately not starts_with("atlas_"):
      # that also matched the manipulation verbs, which have a section of
      # their own, so they were listed twice.
      - has_concept("atlas accessors")
      - starts_with("is_atlas")
      - get_cerebellar_mesh
  - title: Setters
    desc: Replace atlas properties, returning a modified `ggseg_atlas`.
    contents:
      - starts_with("set_")
  - title: Geometry representation (sf-optional)
    desc: |
      Convert atlas 2D geometry between sf and the sf-optional `brain_polygons`
      representation stored in the single `geom` slot, and migrate atlas files.
    contents:
      - as_polygon_atlas
      - as_sf_atlas
      - migrate_atlas_files
      - attach_sfc
      - reorder_sfc
  - title: Atlas manipulation
    desc: |
      Pipe-friendly functions, each group acting on a different thing: the regions an atlas has, the views it has, and which regions are drawn inside a view. All return a new `ggseg_atlas`.
    contents:
      - has_concept("atlas manipulations")
      - relabel_atlas
      - selectors
  - title: Bundled atlases
    desc: Ready-to-use atlases shipped with the package.
    contents:
      - dk
      - aseg
      - tracula
      - suit
  - title: FreeSurfer I/O
    desc: Read FreeSurfer statistics files into R.
    contents:
      - starts_with("read_")
