url: https://ggsegverse.github.io/ggseg.formats/

template:
  package: ggseg.docs

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github, lightswitch]
  components:
    github:
      icon: fa-github
      href: https://github.com/ggsegverse/ggseg.formats
      aria-label: GitHub

reference:
  - title: ggseg atlas
    desc: Create and inspect ggseg atlas objects.
    contents:
      - starts_with("ggseg_")
      - starts_with("is_ggseg")
      - starts_with("as_ggseg")
  - title: Legacy conversion
    desc: Convert old ggseg/ggseg3d atlases to the unified ggseg_atlas format.
    contents:
      - convert_legacy_brain_atlas
      - contains("brain_")
  - title: Accessors
    desc: Query atlas contents without reaching into slots directly.
    contents:
      - starts_with("atlas_")
      - starts_with("is_atlas")
      - get_cerebellar_mesh
      - legacy_region_map
  - title: Setters
    desc: Replace atlas properties, returning a modified `ggseg_atlas`.
    contents:
      - starts_with("set_")
  - title: Geometry representation (sf-optional)
    desc: |
      Convert atlas 2D geometry between sf and the sf-optional `brain_polygons`
      representation stored in the single `geom` slot, and migrate atlas files.
    contents:
      - as_polygon_atlas
      - as_sf_atlas
      - migrate_atlas_files
  - title: Atlas manipulation
    desc: |
      Pipe-friendly functions for subsetting regions, managing views, and enriching metadata. All return a new `ggseg_atlas`.
    contents:
      - atlas_manipulation
      - atlas_structure_reorder
      - relabel_atlas
  - title: Bundled atlases
    desc: Ready-to-use atlases shipped with the package.
    contents:
      - dk
      - aseg
      - tracula
      - suit
  - title: FreeSurfer I/O
    desc: Read FreeSurfer statistics files into R.
    contents:
      - starts_with("read_")
