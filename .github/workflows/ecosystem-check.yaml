# Drives one atlas through the whole suite in a single process, with this
# repo at the pull-request ref and every other package from main.
#
# This used to be a 304-line local copy of the smoke script, which drifted:
# it called atlas_region_keep() through ggseg.extra, which stopped re-exporting
# the atlas verbs in ggseg.extra#428, so every pull request here failed. The
# org reusable already attaches ggseg.formats and guards that case.
#
# The slow full-suite check keeps its own workflow, ecosystem-full-check.yaml.
on:
  pull_request:
  workflow_dispatch:

name: ecosystem-check.yaml

permissions:
  contents: read

jobs:
  ecosystem-check:
    uses: ggsegverse/.github/.github/workflows/ecosystem-check.yaml@main
    secrets: inherit
