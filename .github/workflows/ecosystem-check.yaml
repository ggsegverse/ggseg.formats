name: ggseg Ecosystem Check

# Two jobs with deliberately different costs.
#
# `smoke` runs on every pull request: it installs the suite and drives one
# atlas through both renderers, asserting they agree. Cheap, ubuntu-only, and
# it is the only automatic check in the ecosystem that exercises more than one
# package in a single process.
#
# `check` is the full 5-combination R CMD check of all four packages. Too slow
# for a pull request, so it stays on dispatch and a weekly schedule.

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      ggseg_formats_repo:
        description: 'ggseg.formats repo (owner/repo)'
        required: true
        default: 'ggsegverse/ggseg.formats'
      ggseg_formats_ref:
        description: 'ggseg.formats branch/tag/SHA'
        required: true
        default: 'main'
      ggseg_repo:
        description: 'ggseg repo (owner/repo)'
        required: true
        default: 'ggsegverse/ggseg'
      ggseg_ref:
        description: 'ggseg branch/tag/SHA'
        required: true
        default: 'main'
      ggseg3d_repo:
        description: 'ggseg3d repo (owner/repo)'
        required: true
        default: 'ggsegverse/ggseg3d'
      ggseg3d_ref:
        description: 'ggseg3d branch/tag/SHA'
        required: true
        default: 'main'
      ggsegextra_repo:
        description: 'ggseg.extra repo (owner/repo)'
        required: true
        default: 'ggsegverse/ggseg.extra'
      ggsegextra_ref:
        description: 'ggseg.extra branch/tag/SHA'
        required: true
        default: 'main'

jobs:
  smoke:
    runs-on: ubuntu-latest
    # The name must contain "ecosystem" or "revdep": pr-risk-tier resolves the
    # T2 revdep obligation by matching check-run names against that regex, so a
    # job called anything else passes without ever satisfying the gate it is
    # meant to satisfy.
    name: ecosystem smoke (cross-package)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RGL_USE_NULL: true

    steps:
      # On a pull request the dispatch inputs are empty, so each ref falls back
      # to main. ggseg.formats falls back to the triggering ref instead: the
      # point is to render the consumers against *this* branch's foundation.
      - name: Checkout ggseg.formats
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.ggseg_formats_repo || github.repository }}
          ref: ${{ inputs.ggseg_formats_ref || github.event.pull_request.head.sha || github.sha }}
          path: ggseg.formats

      - name: Checkout ggseg
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.ggseg_repo || 'ggsegverse/ggseg' }}
          ref: ${{ inputs.ggseg_ref || 'main' }}
          path: ggseg

      - name: Checkout ggseg3d
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.ggseg3d_repo || 'ggsegverse/ggseg3d' }}
          ref: ${{ inputs.ggseg3d_ref || 'main' }}
          path: ggseg3d

      - name: Checkout ggseg.extra
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.ggsegextra_repo || 'ggsegverse/ggseg.extra' }}
          ref: ${{ inputs.ggsegextra_ref || 'main' }}
          path: ggseg.extra

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install pak
        run: |
          install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))
        shell: Rscript {0}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev libmagick++-dev libglpk-dev libharfbuzz-dev libfribidi-dev

      - name: Install the suite in dependency order
        run: |
          pak::local_install_deps("ggseg.formats", dependencies = TRUE)
          pak::local_install("ggseg.formats")
          pak::local_install_deps("ggseg", dependencies = TRUE)
          pak::local_install("ggseg")
          pak::local_install_deps("ggseg3d", dependencies = TRUE)
          pak::local_install("ggseg3d")
          pak::pak("drmowinckels/freesurfer@refactor")
          pak::local_install_deps("ggseg.extra", dependencies = TRUE)
          pak::local_install("ggseg.extra")
        shell: Rscript {0}

      - name: Drive one atlas through both renderers
        run: Rscript ggseg.formats/.github/scripts/ecosystem-smoke.R

  check:
    # Not on pull requests: five full R CMD checks of four packages is a
    # release-time gate, not per-PR feedback. `smoke` covers pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout ggseg.formats
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.ggseg_formats_repo || 'ggsegverse/ggseg.formats' }}
          ref: ${{ inputs.ggseg_formats_ref || 'main' }}
          path: ggseg.formats

      - name: Checkout ggseg
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.ggseg_repo || 'ggsegverse/ggseg' }}
          ref: ${{ inputs.ggseg_ref || 'main' }}
          path: ggseg

      - name: Checkout ggseg3d
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.ggseg3d_repo || 'ggsegverse/ggseg3d' }}
          ref: ${{ inputs.ggseg3d_ref || 'main' }}
          path: ggseg3d

      - name: Checkout ggseg.extra
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.ggsegextra_repo || 'ggsegverse/ggseg.extra' }}
          ref: ${{ inputs.ggsegextra_ref || 'main' }}
          path: ggseg.extra

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install pak
        run: |
          install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))
        shell: Rscript {0}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Install ggseg.formats dependencies
        run: |
          pak::local_install_deps("ggseg.formats", dependencies = TRUE)
        shell: Rscript {0}

      - name: Install ggseg.formats
        run: |
          pak::local_install("ggseg.formats")
        shell: Rscript {0}

      - name: Install ggseg dependencies
        run: |
          pak::local_install_deps("ggseg", dependencies = TRUE)
        shell: Rscript {0}

      - name: Install ggseg
        run: |
          pak::local_install("ggseg")
        shell: Rscript {0}

      - name: Install ggseg3d dependencies
        run: |
          pak::local_install_deps("ggseg3d", dependencies = TRUE)
        shell: Rscript {0}

      - name: Install ggseg3d
        run: |
          pak::local_install("ggseg3d")
        shell: Rscript {0}

      - name: Install freesurfer fork
        run: |
          pak::pak("drmowinckels/freesurfer@refactor")
        shell: Rscript {0}

      - name: Install ggseg.extra dependencies
        run: |
          pak::local_install_deps("ggseg.extra", dependencies = TRUE)
        shell: Rscript {0}

      - name: Install rcmdcheck
        run: |
          pak::pak("rcmdcheck")
        shell: Rscript {0}

      - name: Check ggseg.formats
        run: |
          rcmdcheck::rcmdcheck("ggseg.formats", args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check-ggseg.formats")
        shell: Rscript {0}

      - name: Check ggseg
        run: |
          rcmdcheck::rcmdcheck("ggseg", args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check-ggseg")
        shell: Rscript {0}

      - name: Check ggseg3d
        run: |
          rcmdcheck::rcmdcheck("ggseg3d", args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check-ggseg3d")
        shell: Rscript {0}

      - name: Check ggseg.extra
        run: |
          rcmdcheck::rcmdcheck("ggseg.extra", args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check-ggseg.extra")
        shell: Rscript {0}

      - name: Upload ggseg.formats check results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ggseg.formats-${{ matrix.config.os }}-r${{ matrix.config.r }}
          path: check-ggseg.formats

      - name: Upload ggseg check results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ggseg-${{ matrix.config.os }}-r${{ matrix.config.r }}
          path: check-ggseg

      - name: Upload ggseg3d check results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ggseg3d-${{ matrix.config.os }}-r${{ matrix.config.r }}
          path: check-ggseg3d

      - name: Upload ggseg.extra check results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ggseg.extra-${{ matrix.config.os }}-r${{ matrix.config.r }}
          path: check-ggseg.extra

      - name: Show test logs on failure
        if: failure()
        run: |
          echo "=== ggseg.formats ==="
          cat check-ggseg.formats/*.Rcheck/tests/testthat.Rout* 2>/dev/null || echo "No test output"
          echo "=== ggseg ==="
          cat check-ggseg/*.Rcheck/tests/testthat.Rout* 2>/dev/null || echo "No test output"
          echo "=== ggseg3d ==="
          cat check-ggseg3d/*.Rcheck/tests/testthat.Rout* 2>/dev/null || echo "No test output"
          echo "=== ggseg.extra ==="
          cat check-ggseg.extra/*.Rcheck/tests/testthat.Rout* 2>/dev/null || echo "No test output"
        shell: bash
